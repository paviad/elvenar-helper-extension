<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="../Style.css" />
    <script src="../Script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <img src="../Icon.png" alt="ElvenAssist" class="logo" onerror="this.style.display = 'none'" />

      <h1>ElvenAssist for Safari</h1>
      <p class="subtitle">Optimize your city with ease.</p>

      <div id="status-message" class="status-box">Checking status...</div>

      <div class="instructions">
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-text">Open Safari Settings</div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-text">Go to <b>Extensions</b></div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-text">Enable <b>ElvenAssist</b></div>
        </div>
      </div>

      <button id="open-btn">Open Safari Extensions Preferences</button>

      <p class="footer">The app will close after opening settings.</p>
    </div>
  </body>
</html>
